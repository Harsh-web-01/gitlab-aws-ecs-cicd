workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'


variables:
  NETLIFY_SITE_ID: '5cf5db69-9828-4ea0-bffd-a8e3b39340da'

stages:
  - build
  - test
  - deploy_staging
  - deploy_prod
  - deploy_review 
  - .pre

build_website:
  image: node:22-alpine
  stage: build
  script:
    - node --version
    - npm --version
    - npm ci #we write npm ci instead of npm install as now npm will install the exact same packages and 
             #dependencies which are written in the lock-package.json file.
    - npm run build
  artifacts:
    paths:
      - build/

test_website:
  image: alpine
  stage: test
  script:
    - test -f build/index.html 

unit_tests:
  image: node:22-alpine
  stage: test
  script:
    - npm ci
    - npm test
  artifacts:
    when: always
    reports:
      junit: reports/junit.xml


netlify_review:
  image: node:22-alpine
  stage: deploy_review
  rules:
    - if: $CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH
  before_script:
    - npm install -g netlify-cli@20.1.1
    - apk add curl
  script:
    - netlify --version
    - echo "Deploying to site id $NETLIFY_SITE_ID"
    - netlify deploy --dir build


netlify_staging:
  image: node:22-alpine
  stage: deploy_staging
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  before_script:
    - npm install -g netlify-cli@20.1.1
    - apk add curl
  script:
    - netlify --version
    - echo "Deploying to site id $NETLIFY_SITE_ID"
    - netlify deploy --alias staging --dir build
    - curl 'https://staging--kalkalharsh2-learn-gitlab.netlify.app/'


netlify_prod:
  image: node:22-alpine
  stage: deploy_prod
  when: manual #creates a continuous delivery pipeline in which we will be manually pressing a run button to run the production job.
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  before_script:
    - npm install -g netlify-cli@20.1.1
    - apk add curl
  script:
    - netlify --version
    - echo "Deploying to site id $NETLIFY_SITE_ID"
    - netlify deploy --prod --dir build
    - curl 'https://kalkalharsh2-learn-gitlab.netlify.app/'